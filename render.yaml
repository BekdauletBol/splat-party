services:
  - type: web
    name: splat-party
    runtime: node
    plan: free
    # devDependencies are needed for the build, so don't let NODE_ENV skip them
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
